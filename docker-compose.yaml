  db:
    image: postgres:12-alpine
    restart: always
    networks:
      - server-side
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1    
    env_file:
      - .env.dev         

networks:
  # client-side: {}
  server-side: {}

volumes:
  db_data: {}
