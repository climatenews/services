# Local development compose file.
# Recommended flow is Procfile for app processes and this file for Postgres only.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    env_file:
      - .env.dev

volumes:
  db_data: {}
