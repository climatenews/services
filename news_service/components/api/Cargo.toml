[package]
name = "api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]

db = { path = "../db" }

# Date library
time = { version = "0.3.2", features = ["macros", "formatting", "parsing"] }

# Server
actix-web = "4.0.0-beta.19"
actix-cors = "0.7.1"

# Graphql
async-graphql = {version = "7.2.1", default-features = false, features = ["playground"] }
async-graphql-actix-web = "7.2.1"

# Database
sqlx = { version = "0.6.2", features = ["runtime-tokio-rustls", "postgres", "time", "offline"] } 

# Runtime
tokio = {version = "1.15.0", features = ["full"]}

# Misc
anyhow = "1.0.28"
thiserror = "2.0.19"
itertools = "0.15.0"

# Logging
log = "0.4.0"

# Workaround for https://github.com/gyscos/zstd-rs/issues/177
zstd-sys = "=2.0.16"

