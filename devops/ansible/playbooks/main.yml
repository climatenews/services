---
- import_playbook: docker_setup.yml
- hosts: all
  become: true
  vars:
    app_user: "{{ ansible_user | default('ubuntu') }}"
    app_home: "{{ '/home/' + app_user }}"
    app_dir: "{{ app_home }}/services"
  tasks:
    - name: Update apt and install awscli
      apt:
        name: awscli
        state: present
        update_cache: false

    - name: Clone github repository
      git:
        repo: https://github.com/climatenews/services.git
        dest: "{{ app_dir }}/"
        clone: yes
        update: yes

    - name: Copy docker-compose.prod.yaml file
      ansible.builtin.copy:
        src: "{{ app_dir }}/docker-compose.prod.yaml"
        dest: "{{ app_home }}/docker-compose.prod.yaml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '700' 
        remote_src: true      

    - name: Copy postgres maintenance script
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/cron/postgres-maintenance.sh"
        dest: /usr/local/bin/postgres-maintenance.sh
        owner: root
        group: root
        mode: '700'
        remote_src: true

    - name: Copy backup systemd service unit
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/systemd/climatenews-postgres-backup.service"
        dest: /etc/systemd/system/climatenews-postgres-backup.service
        owner: root
        group: root
        mode: '644'
        remote_src: true

    - name: Copy backup systemd timer unit
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/systemd/climatenews-postgres-backup.timer"
        dest: /etc/systemd/system/climatenews-postgres-backup.timer
        owner: root
        group: root
        mode: '644'
        remote_src: true

    - name: Copy restore verification systemd service unit
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/systemd/climatenews-postgres-restore-verify.service"
        dest: /etc/systemd/system/climatenews-postgres-restore-verify.service
        owner: root
        group: root
        mode: '644'
        remote_src: true

    - name: Copy restore verification systemd timer unit
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/systemd/climatenews-postgres-restore-verify.timer"
        dest: /etc/systemd/system/climatenews-postgres-restore-verify.timer
        owner: root
        group: root
        mode: '644'
        remote_src: true

    - name: Copy production deploy script
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/scripts/deploy-prod.sh"
        dest: /usr/local/bin/deploy-prod.sh
        owner: root
        group: root
        mode: '700'
        remote_src: true

    - name: Copy production health check script
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/scripts/check-prod-health.sh"
        dest: /usr/local/bin/check-prod-health.sh
        owner: root
        group: root
        mode: '700'
        remote_src: true

    - name: Copy backup timer check script
      ansible.builtin.copy:
        src: "{{ app_dir }}/devops/scripts/check-backup-timers.sh"
        dest: /usr/local/bin/check-backup-timers.sh
        owner: root
        group: root
        mode: '700'
        remote_src: true

    - name: Remove daily backup cronjob (migrated to systemd timer)
      cron:
        name: "Backup postgres database (daily schedule)"
        cron_file: "postgres-backup"
        user: "root"
        state: absent

    - name: Remove weekly restore verification cronjob (migrated to systemd timer)
      cron:
        name: "Verify postgres backup restore (weekly schedule)"
        cron_file: "postgres-restore-verify"
        user: "root"
        state: absent

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start postgres backup timer
      ansible.builtin.systemd:
        name: climatenews-postgres-backup.timer
        enabled: true
        state: started

    - name: Enable and start postgres restore verification timer
      ansible.builtin.systemd:
        name: climatenews-postgres-restore-verify.timer
        enabled: true
        state: started
