query GetNewsFeedUrlAndReferences($urlSlug: String!) {
  newsFeedUrl(urlSlug: $urlSlug) {
    urlSlug
    urlId
    urlScore
    numReferences
    firstReferencedByUsername
    createdAt
    title
    description
    expandedUrlParsed
    expandedUrlHost
    previewImageThumbnailUrl
    previewImageUrl
    displayUrl
  }
  newsFeedUrlReferences(urlSlug: $urlSlug) {
    postUri
    postText
    postCreatedAtStr
    authorHandle
    repostedByHandles
  }
}
